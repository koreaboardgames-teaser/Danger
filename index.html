<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>찌리릿! 시뮬레이터</title>
    <style>
        :root { --neon: #ffcc00; --danger: #ff4444; --c10: rgba(255,204,0,0.15); --c20: rgba(255,136,0,0.15); --c30: rgba(255,68,0,0.15); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #0a192f; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; }
        
        #game-container { 
            width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; 
            background: rgba(10, 25, 47, 0.98); position: relative; 
        }

        /* 상단 로고 영역 - 여백 최소화 */
        .header { height: 40px; display: flex; align-items: center; justify-content: center; position: relative; margin-top: 10px; flex-shrink: 0; margin-bottom: 0; }
        .logo-main { width: 110px; filter: drop-shadow(0 0 8px var(--neon)); }
        .refresh-btn { position: absolute; right: 15px; font-size: 26px; color: rgba(255, 255, 255, 0.4); cursor: pointer; z-index: 8000; }

        /* 보드 영역 */
        .board { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; z-index: 50; margin-top: -10px; }
        .card-on-board { width: 100px; aspect-ratio: 1/1.4; border-radius: 10px; position: absolute; box-shadow: 0 10px 25px rgba(0,0,0,0.7); transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        
        /* 내 카드 위치: 잘리지 않도록 위로 보정 */
        .pos-p { bottom: 25px; left: 50%; transform: translateX(-50%); } 
        .pos-c1 { left: 40px; top: 0px; transform: rotate(5deg); } 
        .pos-c2 { right: 40px; top: 0px; transform: rotate(-5deg); }
        .winner-card { border: 4px solid #fff; box-shadow: 0 0 30px #fff; z-index: 100 !important; }

        /* 하단 패널 */
        .panel { 
            height: 560px; flex-shrink: 0; background: rgba(0,0,0,0.85); 
            border-radius: 40px 40px 0 0; padding: 20px; display: flex; flex-direction: column; z-index: 100;
        }
        .status { height: 50px; text-align: center; color: var(--neon); font-weight: 900; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,0,0,1); }

        /* 슬롯 영역 (노란색 보정) */
        .slots-container { display: flex; justify-content: space-between; gap: 8px; height: 230px; margin-bottom: 5px; }
        .col-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .col { width: 100%; height: 205px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; padding-top: 50px; position: relative; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        #col-10 { background: var(--c10); } #col-20 { background: var(--c20); } #col-30 { background: var(--c30); }
        
        .col-val { margin-top: 6px; color: var(--neon); font-weight: 800; font-size: 1.1rem; opacity: 0; transition: 0.3s; }
        .col-val.show { opacity: 1; }
        /* 점수 하락 시 빨간색 반전 */
        .drop { color: var(--danger) !important; text-shadow: 0 0 15px var(--danger) !important; transform: scale(1.1); }

        /* 방패 아이콘 */
        .pop-icon { position: absolute; width: 52px; top: 15px; left: 50%; transform: translateX(-50%) scale(0); z-index: 150; opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .pop-icon.active { transform: translateX(-50%) scale(1.1); opacity: 1; }
        .pop-icon.shrink { transform: translateX(-50%) scale(0); opacity: 0; }
        
        @keyframes thud { 0% { transform: translateX(-50%) translateY(-100px) scale(2); opacity: 0; } 100% { transform: translateX(-50%) translateY(0) scale(1.1); opacity: 1; } }
        .pop-icon.thud { animation: thud 0.5s ease-out forwards; }

        .mini { width: 58px; aspect-ratio: 1/1.4; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 6px; position: absolute; transition: all 0.5s ease; }
        .mini.rank-0 { top: 50px; z-index: 10; border: 2px solid var(--neon); box-shadow: 0 0 10px var(--neon); }
        .mini.rank-1 { top: 110px; z-index: 5; opacity: 0.6; transform: scale(0.9); }

        /* 총점 (초록색 보정) */
        .total { text-align: center; font-size: 2.7rem; font-weight: 900; color: var(--neon); margin: 15px 0 10px 0; opacity: 0; transition: 0.3s; height: 55px; flex-shrink: 0; }
        .total.show { opacity: 1; }

        /* 손패 */
        .hand { height: 120px; display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 5px; flex-shrink: 0; } 
        .hand img { width: 85px; aspect-ratio: 1/1.4; cursor: pointer; border-radius: 8px; box-shadow: 0 0 15px var(--neon); animation: pulse 1s infinite alternate; }

        /* 팝업 오버레이 */
        #tutorial-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 9000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .tuto-box { background: #142846; border: 2px solid var(--neon); border-radius: 25px; padding: 30px; text-align: center; width: 100%; max-width: 320px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .tuto-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 25px; font-weight: 700; min-height: 55px; display: flex; align-items: center; justify-content: center; word-break: keep-all; }
        .tuto-btn { background: var(--neon); color: black; border: none; padding: 14px 0; border-radius: 15px; font-weight: 900; font-size: 1.1rem; cursor: pointer; width: 100%; }

        #splash-screen { position: absolute; inset: 0; background: #0a192f; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .start-btn { background: none; border: 3px solid #fff; color: #fff; padding: 15px 50px; border-radius: 50px; font-size: 1.4rem; font-weight: 900; cursor: pointer; transition: 0.3s; }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        img { max-width: 100%; height: auto; object-fit: contain; }
    </style>
</head>
<body>

<div id="splash-screen">
    <img src="danger_logo_kr_W.png" style="width: 250px; margin-bottom: 60px; filter: drop-shadow(0 0 15px var(--neon));">
    <button class="start-btn" onclick="startFlow()">게임 시작</button>
</div>

<div id="game-container">
    <div class="header">
        <img src="danger_logo_kr_W.png" class="logo-main">
        <div class="refresh-btn" onclick="location.reload()">↺</div>
    </div>
    <div class="board" id="board"></div>
    <div class="panel">
        <div class="status" id="status">카드를 내 주세요.</div>
        <div class="slots-container">
            <div class="col-wrapper"><img src="score_2.png" class="pop-icon" id="pop-10"><div id="col-10" class="col"></div><div class="col-val" id="val-10">2점</div></div>
            <div class="col-wrapper"><img src="score_4.png" class="pop-icon" id="pop-20"><div id="col-20" class="col"></div><div class="col-val" id="val-20">4점</div></div>
            <div class="col-wrapper"><img src="score_5.png" class="pop-icon" id="pop-30"><div id="col-30" class="col"></div><div class="col-val" id="val-30">5점</div></div>
        </div>
        <div class="total" id="score">0점</div>
        <div class="hand" id="hand-container"></div>
    </div>
</div>

<div id="tutorial-overlay">
    <div class="tuto-box">
        <div class="tuto-text" id="tuto-text"></div>
        <button class="tuto-btn" onclick="nextTuto()">다음</button>
    </div>
</div>

<script>
    let tutoIdx = 0, inv = {10:[], 20:[], 30:[]}, isProcessing = false;
    const tutoScripts = [
        "찌리릿에 오신 것을 환영합니다!<br>직접 카드를 내보며 규칙을 알아볼까요?", // 0
        "내 차례에는 손에 든 카드 중 한 장을 골라 냅니다.", // 1
        "35 카드를 내 보세요!", // 2
        "가장 높은 숫자를 낸 사람이 승자!<br>승자는 모든 카드를 가져옵니다!", // 3
        "가져온 카드는 색깔별로 모아 정리합니다. 각 색깔마다 가장 낮은 숫자만 점수가 됩니다!", // 4
        "각 카드의 위쪽에 적힌 점수를 획득합니다.", // 5
        "다시 한 번 해볼까요!", // 6
        "이번에도 승리했네요! 모든 카드를 가져옵니다!", // 7
        "하지만, 각 색깔별로 가장 낮은 숫자의 점수만 승점이 됩니다.", // 8 [추가 문구]
        "과연 내 점수는 어떻게 변할까요?" // 9
    ];

    function startFlow() {
        document.getElementById('splash-screen').style.display = 'none';
        updateTuto();
    }

    async function nextTuto() {
        if (isProcessing) return;
        const overlay = document.getElementById('tutorial-overlay');
        
        if (tutoIdx === 0) { tutoIdx++; updateTuto(); }
        else if (tutoIdx === 1) { tutoIdx++; overlay.style.display = 'none'; showHand(35, runFirstRound); }
        else if (tutoIdx === 3) { overlay.style.display = 'none'; await collectCards([35, 12, 24], false); tutoIdx = 5; updateTuto(); }
        else if (tutoIdx === 5) { overlay.style.display = 'none'; await runScoringSequence(6); }
        else if (tutoIdx === 6) { document.getElementById('board').innerHTML = ""; tutoIdx++; overlay.style.display = 'none'; showHand(33, runSecondRound); }
        else if (tutoIdx === 7) { tutoIdx++; updateTuto(); }
        else if (tutoIdx === 8) { overlay.style.display = 'none'; await collectCards([16, 26, 33], true); } // 2라운드 순차 연출 시작
        else { tutoIdx++; updateTuto(); }
    }

    function updateTuto() {
        const overlay = document.getElementById('tutorial-overlay'), text = document.getElementById('tuto-text');
        overlay.style.display = 'flex';
        text.innerHTML = tutoScripts[tutoIdx];
    }

    function showHand(val, callback) {
        const hand = document.getElementById('hand-container');
        hand.innerHTML = `<img src="${val}.png" onclick="if(!isProcessing){this.remove(); ${callback.name}();}">`;
    }

    async function runFirstRound() {
        isProcessing = true;
        const b = document.getElementById('board'); b.appendChild(create(35, 'p'));
        document.getElementById('status').innerText = "상대가 카드를 고르고 있습니다";
        await delay(800); b.appendChild(create(12, 'c1')); await delay(800); b.appendChild(create(24, 'c2'));
        await delay(1200); document.getElementById('status').innerText = "35 카드가 승리했습니다!";
        document.querySelectorAll('.card-on-board')[0].classList.add('winner-card'); 
        await delay(1500); tutoIdx = 3; updateTuto();
        isProcessing = false;
    }

    async function runSecondRound() {
        isProcessing = true;
        const b = document.getElementById('board'); b.appendChild(create(33, 'p'));
        document.getElementById('status').innerText = "상대가 카드를 고르고 있습니다";
        await delay(800); b.appendChild(create(16, 'c1')); await delay(800); b.appendChild(create(26, 'c2'));
        await delay(1200); document.getElementById('status').innerText = "33 카드가 승리했습니다!";
        document.querySelectorAll('.card-on-board')[0].classList.add('winner-card'); 
        await delay(1500); tutoIdx = 7; updateTuto();
        isProcessing = false;
    }

    async function collectCards(cardVals, isSequential) {
        isProcessing = true;
        const boardCards = Array.from(document.querySelectorAll('.card-on-board'));
        for (let i = 0; i < cardVals.length; i++) {
            const val = cardVals[i], cardEl = boardCards.find(el => el.src.includes(val + '.png'));
            const colId = Math.floor(val/10)*10, targetRect = document.getElementById(`col-${colId}`).getBoundingClientRect(), cardRect = cardEl.getBoundingClientRect();
            cardEl.style.transform += ` translate(${targetRect.left + targetRect.width/2 - (cardRect.left + cardRect.width/2)}px, ${targetRect.top + targetRect.height/2 - (cardRect.top + cardRect.height/2)}px) scale(0.2)`;
            cardEl.style.opacity = '0'; inv[colId].push(val);

            if (isSequential) {
                await delay(800);
                updateInventoryUI(true); 
                // 2라운드 개별 점수 확인 연출 (요청사항 반영)
                if (val === 16) showPopShield(10, "score_2.png", "2점");
                if (val === 26) showPopShield(20, "score_4.png", "4점");
                if (val === 33) await triggerScoreDropEffect();
            } else {
                await delay(200);
            }
        }
        await delay(1000);
        document.getElementById('board').innerHTML = "";
        if (isSequential) {
            // 모든 방패 축소 후 튜토리얼 마무리 단계로
            [10, 20, 30].forEach(id => document.getElementById(`pop-${id}`).classList.add('shrink'));
            await delay(600); tutoIdx = 9; updateTuto();
        } else {
            updateInventoryUI(false);
        }
        isProcessing = false;
    }

    function showPopShield(id, img, text) {
        const icon = document.getElementById(`pop-${id}`), val = document.getElementById(`val-${id}`);
        icon.src = img; icon.classList.remove('shrink'); icon.classList.add('active');
        val.innerText = text; val.classList.add('show');
    }

    async function triggerScoreDropEffect() {
        const val30 = document.getElementById('val-30'), scoreTotal = document.getElementById('score'), pop30 = document.getElementById('pop-30');
        // 기존 5점 상태를 잠시 유지 (가시성을 위해)
        pop30.src = "score_5.png"; pop30.classList.remove('shrink'); pop30.classList.add('active');
        await delay(400);

        // [쿵!] 3점으로 교체하며 하락 연출
        pop30.classList.remove('active'); void pop30.offsetWidth;
        pop30.src = "score_3.png"; pop30.classList.add('thud');
        val30.innerText = "3점"; scoreTotal.innerText = "9점";
        val30.classList.add('drop'); scoreTotal.classList.add('drop');
        await delay(1200);
        val30.classList.remove('drop'); scoreTotal.classList.remove('drop');
    }

    async function runScoringSequence(nextIdx) {
        isProcessing = true;
        const sequence = [10, 20, 30];
        for (let s of sequence) {
            const icon = document.getElementById(`pop-${s}`), valText = document.getElementById(`val-${s}`);
            icon.classList.add('active'); await delay(450);
            valText.classList.add('show'); await delay(450);
        }
        const scoreEl = document.getElementById('score'); scoreEl.classList.add('show'); scoreEl.innerText = "11점";
        await delay(1200);
        for (let s of sequence) document.getElementById(`pop-${s}`).classList.add('shrink');
        await delay(600); tutoIdx = nextIdx; updateTuto();
        isProcessing = false;
    }

    function updateInventoryUI(isSorting) {
        for (const t of [10, 20, 30]) {
            const col = document.getElementById(`col-${t}`); col.innerHTML = "";
            let ns = [...new Set(inv[t])].sort((a,b) => a-b);
            ns.forEach((n, idx) => {
                const img = document.createElement('img'); img.src = `${n}.png`; img.className = 'mini';
                if (isSorting) img.classList.add(`rank-${idx}`); else img.style.top = (50 + idx * 12) + "px";
                col.appendChild(img);
            });
        }
    }

    function create(v, t) {
        const i = document.createElement('img'); i.src = `${v}.png`; i.className = 'card-on-board';
        if(t==='p') i.classList.add('pos-p'); else if(t==='c1') i.classList.add('pos-c1'); else i.classList.add('pos-c2');
        return i;
    }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
