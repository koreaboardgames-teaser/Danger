<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>찌리릿! 시뮬레이터</title>
    <style>
        :root { --neon: #ffcc00; --zap: #00ffff; --c10: rgba(255,204,0,0.15); --c20: rgba(255,136,0,0.15); --c30: rgba(255,68,0,0.15); }
        body { margin: 0; background: url('bg.jpg') center/cover fixed; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; color: white; }
        #game-container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; background: rgba(10, 25, 47, 0.96); backdrop-filter: blur(25px); position: relative; }

        /* 팝업창 설정 */
        #tutorial-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); 
            z-index: 5000; display: flex; justify-content: center; align-items: center; 
            padding: 20px; box-sizing: border-box;
            transition: opacity 0.8s ease; 
        }
        .tuto-box { 
            background: rgba(20, 40, 70, 0.92); border: 2px solid var(--neon); 
            border-radius: 20px; padding: 25px; text-align: center; 
            box-shadow: 0 0 25px rgba(0,0,0,0.5); width: 80%; max-width: 280px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .tuto-text { font-size: 1.05rem; line-height: 1.5; margin-bottom: 20px; min-height: 50px; display: flex; align-items: center; justify-content: center; word-break: keep-all; }
        .tuto-btn { background: var(--neon); color: black; border: none; padding: 10px 35px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; align-self: center; }
        .tuto-start-btn { display: none; background: #fff; color: #000; border: none; padding: 12px 30px; border-radius: 10px; font-weight: 900; cursor: pointer; font-size: 1.05rem; text-decoration: none; align-self: center; }

        #click-guide { display: none; position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 18px; border-radius: 20px; border: 1px solid var(--neon); font-size: 0.85rem; z-index: 4000; animation: flash 1.5s infinite; }

        .header { flex: 0.5; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px 20px; }
        .logo-main { width: 110px; filter: drop-shadow(0 0 8px var(--neon)); }
        .opp-scores { display: flex; justify-content: space-between; width: 70%; font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.4); }
        .opp-val { color: var(--neon); margin-left: 5px; }

        .board { flex: 6.5; position: relative; display: flex; justify-content: center; align-items: center; margin: 0 10px; background: rgba(255,255,255,0.02); border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .card-on-board { width: 105px; border-radius: 10px; position: absolute; box-shadow: 0 15px 40px rgba(0,0,0,0.8); transition: all 0.5s ease-out; z-index: 100; }
        
        .pos-p { bottom: 10%; left: 50%; transform: translateX(-50%); }
        .pos-c1 { left: 40px; top: 15%; transform: rotate(12deg); } 
        .pos-c2 { right: 40px; top: 15%; transform: rotate(-12deg); }
        
        .panel { flex: 5.5; display: flex; flex-direction: column; padding: 15px 20px; box-sizing: border-box; background: rgba(0,0,0,0.5); border-radius: 50px 50px 0 0; }
        .status { height: 35px; text-align: center; color: var(--neon); font-weight: 800; font-size: 1.3rem; margin-bottom: 5px; }

        .slots-container { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        .col-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; }

        .col { 
            width: 100%; 
            height: 140px; 
            border-radius: 18px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            padding-top: 100px; 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.1); 
            overflow: visible; 
            z-index: 10; 
        }
        #col-10 { background: var(--c10); } #col-20 { background: var(--c20); } #col-30 { background: var(--c30); }
        
        .col-val { margin-top: 8px; color: var(--neon); font-weight: 800; font-size: 1rem; height: 1.2rem; }

        /* 카드 공통 스타일: 첫 번째 카드는 padding-top(100px)에 붙고, 이후 카드는 겹쳐짐 */
        .mini { width: 60px; height: 85px; border: 1.5px solid rgba(255,255,255,0.1); border-radius: 6px; margin-top: -62px; position: relative; z-index: 5; }
        .mini:first-child { margin-top: 0; }

        /* [수정] 감전 카드: order 제거 및 가시성 개선 */
        .mini.zapped { filter: grayscale(1) brightness(0.4); opacity: 0.9; z-index: 1; border-color: rgba(255,255,255,0.3); } 

        /* [수정] 점수 카드: order와 강제 마진 제거. 이제 DOM 순서에 의해 최상단 정렬됨 */
        .mini.safe { 
            margin-bottom: 15px; 
            border: 2.5px solid var(--neon); 
            box-shadow: 0 0 15px var(--neon); 
            z-index: 100; 
            transform: scale(1.05); 
        }

        .zap-overlay { position: absolute; width: 150px; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; transition: 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 2000; pointer-events: none; filter: drop-shadow(0 0 35px #000); }
        .active-zap .zap-overlay { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }

        .total { text-align: center; font-size: 2.2rem; font-weight: 900; color: var(--neon); margin-bottom: 15px; }
        .hand { display: flex; gap: 10px; justify-content: center; margin-bottom: 10px; } 
        .hand img { width: 85px; cursor: pointer; border-radius: 10px; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0.15; pointer-events: none; }
        .hand img.playable { opacity: 1; pointer-events: auto; box-shadow: 0 0 20px var(--neon); animation: pulse 1s infinite alternate; }

        .reset-link { text-align: center; font-size: 11px; opacity: 0.4; cursor: pointer; text-decoration: underline; margin-top: auto; padding-bottom: 10px; }
        
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body onclick="handleGlobalClick()">

<div id="click-guide">화면을 클릭하여 계속하기</div>

<div id="tutorial-overlay">
    <div class="tuto-box">
        <div class="tuto-text" id="tuto-text">찌리릿은 숫자가 연결되면 감전되어 버리는 위험천만한 게임입니다.</div>
        <button class="tuto-btn" id="tuto-btn" onclick="nextTuto(event)">다음</button>
        <button class="tuto-start-btn" id="tuto-start-btn" onclick="startMainGame()">게임 체험해 보기</button>
    </div>
</div>

<div id="game-container">
    <div class="header">
        <img src="danger_logo_kr_W.png" class="logo-main">
        <div class="opp-scores">
            <div>상대 1: <span id="cpu1-score" class="opp-val">0점</span></div>
            <div>상대 2: <span id="cpu2-score" class="opp-val">0점</span></div>
        </div>
    </div>
    <div class="board" id="board"></div>
    <div class="panel">
        <div class="status" id="status"></div>
        <div class="slots-container">
            <div class="col-wrapper"><div id="col-10" class="col"><img src="danger_logo_kr_W.png" class="zap-overlay"></div><div class="col-val" id="val-10"></div></div>
            <div class="col-wrapper"><div id="col-20" class="col"><img src="danger_logo_kr_W.png" class="zap-overlay"></div><div class="col-val" id="val-20"></div></div>
            <div class="col-wrapper"><div id="col-30" class="col"><img src="danger_logo_kr_W.png" class="zap-overlay"></div><div class="col-val" id="val-30"></div></div>
        </div>
        <div class="total" id="score">0점</div>
        <div class="hand" id="hand-container">
            <img src="35.png" id="h35" onclick="tutorialAction(event)">
        </div>
        <div class="reset-link" onclick="location.reload()">처음으로 돌아가기 ↺</div>
    </div>
</div>

<script>
    let tutoIdx = 0;
    let isScoreViewing = false;
    let round = 0, inv = {10:[], 20:[], 30:[]}, oppScores = [0, 0], locked = false;

    const tutoScripts = [
        "찌리릿은 숫자가 연결되면 감전되어 버리는 위험천만한 게임입니다.",
        "내 차례에는 손에 든 카드를 한 장 골라 냅니다.",
        "[카드를 내세요]", 
        "획득한 카드는 색깔별로 모아 내 앞에 깔아 둡니다.",
        "각 색깔 별로 가장 낮은 숫자가 내 점수가 됩니다.",
        "점수 확인 단계", 
        "하지만 조심하세요! 서로 연결된 숫자는 찌리릿! 감전되어 점수를 계산하지 않습니다!", 
        "[카드를 내세요]", 
        "내 점수는 지키고, 다른 사람에게는 감전을 선물로 줄 수 있을까요!" 
    ];

    const mainScenario = [{ c1: 10, c2: 11 }, { c1: 24, c2: 26 }, { c1: 33, c2: 35 }];

    function nextTuto(e) {
        if(e) e.stopPropagation();
        tutoIdx++;
        if (tutoIdx === 5) {
            isScoreViewing = true;
            document.getElementById('tutorial-overlay').style.opacity = '0';
            setTimeout(() => { document.getElementById('tutorial-overlay').style.display = 'none'; }, 800);
            document.getElementById('click-guide').style.display = 'block';
            showTutorialScores();
        } else if (tutoIdx === 6) {
            isScoreViewing = false;
            document.getElementById('click-guide').style.display = 'none';
            resetBoard();
            updateTuto();
        } else {
            updateTuto();
        }
    }

    function handleGlobalClick() {
        if (isScoreViewing) nextTuto();
    }

    function updateTuto() {
        const overlay = document.getElementById('tutorial-overlay');
        const text = document.getElementById('tuto-text');
        const btn = document.getElementById('tuto-btn');
        const startBtn = document.getElementById('tuto-start-btn');
        const h35 = document.getElementById('h35');
        text.innerText = tutoScripts[tutoIdx];
        if (tutoScripts[tutoIdx] === "[카드를 내세요]") {
            overlay.style.display = 'none';
            h35.classList.add('playable');
            h35.style.opacity = "1";
            h35.style.pointerEvents = "auto";
        } else if (tutoIdx === 8) {
            btn.style.display = 'none';
            startBtn.style.display = 'block';
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
        } else {
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            h35.classList.remove('playable');
        }
    }

    async function tutorialAction(e) {
        if(e) e.stopPropagation();
        const h35 = document.getElementById('h35');
        if (!h35.classList.contains('playable')) return;
        h35.classList.remove('playable');
        h35.style.opacity = "0.15"; h35.style.pointerEvents = "none";
        const b = document.getElementById('board');
        const pObj = create(35, 'p'); b.appendChild(pObj);
        if (tutoIdx === 2) { 
            await delay(500);
            const c1 = create(12, 'c1'); b.appendChild(c1); await delay(500);
            const c2 = create(24, 'c2'); b.appendChild(c2); await delay(800);
            [pObj, c1, c2].forEach(i => { i.style.transform += ' translateY(600px) scale(0.1)'; i.style.opacity = '0'; });
            await delay(600);
            updateBoardUI([35, 12, 24], false);
            [pObj, c1, c2].forEach(i => i.remove());
            nextTuto();
        } else if (tutoIdx === 7) { 
            await delay(500);
            const c1 = create(24, 'c1'); b.appendChild(c1); await delay(500);
            const c2 = create(34, 'c2'); b.appendChild(c2); await delay(800);
            [pObj, c1, c2].forEach(i => { i.style.transform += ' translateY(600px) scale(0.1)'; i.style.opacity = '0'; });
            await delay(600);
            updateBoardUI([35, 24, 34], true); 
            [pObj, c1, c2].forEach(i => i.remove());
            await delay(4000); 
            nextTuto();
        }
    }

    function showTutorialScores() {
        // 첫 번째 시뮬레이션의 점수 표시 (강제 데이터)
        document.getElementById('val-10').innerText = "2점";
        document.getElementById('val-20').innerText = "4점";
        document.getElementById('val-30').innerText = "5점";
        document.getElementById('score').innerText = "11점";
    }

    function startMainGame() {
        document.getElementById('tutorial-overlay').style.display = 'none';
        resetBoard();
        document.getElementById('status').innerText = "카드를 선택하세요";
        const hand = document.getElementById('hand-container');
        hand.innerHTML = `
            <img src="13.png" id="h13" class="playable" onclick="play(13)">
            <img src="25.png" id="h25" class="playable" onclick="play(25)">
            <img src="34.png" id="h34" class="playable" onclick="play(34)">
        `;
    }

    async function play(val) {
        if (locked || round >= 3) return;
        locked = true;
        const target = document.getElementById(`h${val}`);
        target.style.opacity = "0.15"; target.style.pointerEvents = "none";
        const b = document.getElementById('board'), cur = mainScenario[round];
        document.getElementById('status').innerText = "카드 제출 중...";
        const pObj = create(val, 'p'); b.appendChild(pObj); await delay(450); 
        const c1Obj = create(cur.c1, 'c1'); b.appendChild(c1Obj); await delay(450);
        const c2Obj = create(cur.c2, 'c2'); b.appendChild(c2Obj); await delay(800);
        const vals = [val, cur.c1, cur.c2];
        const max = Math.max(...vals);
        const winIdx = vals.indexOf(max); 
        const active = [pObj, c1Obj, c2Obj];
        if (winIdx === 0) {
            document.getElementById('status').innerText = "라운드 승리! 카드 획득!";
            active.forEach(i => { i.style.transform += ' translateY(600px) scale(0.1)'; i.style.opacity = '0'; });
            await delay(600);
            vals.forEach(v => inv[Math.floor(v/10)*10].push(v));
            await updateMainUI(new Set(vals.map(v => Math.floor(v/10)*10)));
        } else {
            document.getElementById('status').innerText = `상대 ${winIdx} 승리!`;
            active.forEach(i => { i.style.transform += ' translateY(-500px) scale(0.1)'; i.style.opacity = '0'; });
            await delay(600);
            oppScores[winIdx-1] += (Math.min(...vals) % 10);
            document.getElementById(`cpu1-score`).innerText = oppScores[0] + "점";
            document.getElementById(`cpu2-score`).innerText = oppScores[1] + "점";
        }
        active.forEach(i => i.remove());
        round++; locked = false;
        if(round < 3) document.getElementById('status').innerText = "다음 카드를 선택하세요";
        else document.getElementById('status').innerText = "게임 종료!";
    }

    function resetBoard() {
        [10, 20, 30].forEach(t => {
            const col = document.getElementById(`col-${t}`);
            col.querySelectorAll('.mini').forEach(m => m.remove());
            document.getElementById(`val-${t}`).innerText = "";
        });
        document.getElementById('score').innerText = "0점";
        inv = {10:[], 20:[], 30:[]};
    }

    /* ------------------- [핵심 수정: 카드 렌더링 로직] ------------------- */
    function updateBoardUI(newCards, immediateScore) {
        let tempInv = {10:[], 20:[], 30:[]};
        newCards.forEach(v => tempInv[Math.floor(v/10)*10].push(v));
        let total = 0;
        [10, 20, 30].forEach(t => {
            const col = document.getElementById(`col-${t}`);
            col.querySelectorAll('.mini').forEach(m => m.remove());
            
            let ns = [...new Set(tempInv[t])].sort((a,b) => a-b);
            let z = new Set();
            for(let i=0; i<ns.length; i++) if(ns[i+1]===ns[i]+1 || ns[i-1]===ns[i]-1) z.add(ns[i]);
            
            let safeCards = ns.filter(n => !z.has(n));
            let scoreVal = safeCards.length > 0 ? Math.min(...safeCards) : null;

            // [정렬 로직] 점수 카드(Safe)를 배열의 맨 앞으로 보내서 'first-child'가 되게 함
            let displayOrder = ns.slice().sort((a, b) => {
                if (a === scoreVal) return -1;
                if (b === scoreVal) return 1;
                return a - b;
            });

            displayOrder.forEach(n => {
                const img = document.createElement('img'); img.src = `${n}.png`;
                img.className = 'mini' + (z.has(n) ? ' zapped' : (n === scoreVal ? ' safe' : ''));
                col.appendChild(img);
            });

            if(z.size > 0) { col.classList.add('active-zap'); setTimeout(() => col.classList.remove('active-zap'), 1500); }
            if(immediateScore) {
                const s = scoreVal !== null ? (scoreVal % 10) : 0;
                document.getElementById(`val-${t}`).innerText = s + "점";
                total += s;
            }
        });
        if(immediateScore) document.getElementById('score').innerText = total + "점";
    }

    async function updateMainUI(affected = new Set()) {
        let ts = 0;
        for (const t of [10, 20, 30]) {
            const col = document.getElementById(`col-${t}`);
            const valDisplay = document.getElementById(`val-${t}`);
            col.querySelectorAll('.mini').forEach(m => m.remove());
            
            let ns = [...new Set(inv[t])].sort((a,b) => a-b);
            let z = new Set();
            for(let i=0; i<ns.length; i++) if(ns[i+1]===ns[i]+1 || ns[i-1]===ns[i]-1) z.add(ns[i]);
            
            let safeCards = ns.filter(n => !z.has(n));
            let scoreVal = safeCards.length > 0 ? Math.min(...safeCards) : null;

            // [정렬 로직] 점수 카드(Safe)를 맨 위(DOM의 첫 번째)로 배치
            let displayOrder = ns.slice().sort((a, b) => {
                if (a === scoreVal) return -1;
                if (b === scoreVal) return 1;
                return a - b;
            });

            displayOrder.forEach(n => {
                const img = document.createElement('img'); img.src = `${n}.png`;
                img.className = 'mini' + (z.has(n) ? ' zapped' : (n === scoreVal ? ' safe' : ''));
                col.appendChild(img);
            });

            if(affected.has(t) && z.size > 0) { col.classList.add('active-zap'); await delay(1200); col.classList.remove('active-zap'); }
            if(scoreVal !== null) { valDisplay.innerText = (scoreVal % 10) + "점"; ts += (scoreVal % 10); } 
            else { valDisplay.innerText = "0점"; }
        }
        document.getElementById('score').innerText = ts + "점";
    }

    function create(v, t) {
        const i = document.createElement('img'); i.src = `${v}.png`; i.className = 'card-on-board';
        if(t==='p') i.classList.add('pos-p');
        else if(t==='c1') i.classList.add('pos-c1');
        else i.classList.add('pos-c2');
        return i;
    }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
    window.onload = () => { document.getElementById('tuto-text').innerText = tutoScripts[0]; };
</script>
</body>
</html>
